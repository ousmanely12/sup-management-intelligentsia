<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription — Sup Management Intelligentsia</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="login-body">
    <div class="login-page">
      <div class="login-card" style="max-width: 520px">
        <div class="login-header">
          <img
            src="../logo_SMI.png"
            alt="SMI Logo"
            style="
              height: 60px;
              width: auto;
              max-width: 120px;
              margin-bottom: 1rem;
              display: block;
              margin-left: auto;
              margin-right: auto;
            "
          />
          <h1>Créer un compte étudiant</h1>
          <p>Remplissez le formulaire pour vous inscrire</p>
        </div>

        <div class="alert alert-error" id="alert-error"></div>
        <div class="alert alert-success" id="alert-success"></div>

        <!-- Étape 1 : Infos personnelles -->
        <div id="step-1">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
            <div class="form-group" style="text-align: left">
              <label>Nom</label>
              <input type="text" id="reg-nom" placeholder="Diallo" />
            </div>
            <div class="form-group" style="text-align: left">
              <label>Prénom</label>
              <input type="text" id="reg-prenom" placeholder="Moussa" />
            </div>
          </div>

          <div class="form-group" style="text-align: left">
            <label>Adresse email</label>
            <input type="email" id="reg-email" placeholder="moussa@gmail.com" />
          </div>

          <div class="form-group" style="text-align: left">
            <label>Mot de passe</label>
            <input
              type="password"
              id="reg-password"
              placeholder="minimum 6 caractères"
            />
          </div>


          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
            <div class="form-group" style="text-align: left">
              <label>Filière</label>
              <select id="reg-filiere">
                <option value="">-- Choisir --</option>
                <option>Comptabilité de Gestion</option>
                <option>Management</option>
                <option>Commerce International</option>
                <option>Informatique de Gestion</option>
                <option>Transport & Logistique</option>
              </select>
            </div>
            <div class="form-group" style="text-align: left">
              <label>Niveau</label>
              <select id="reg-niveau">
                <option value="">-- Choisir --</option>
                <option>Licence 1</option>
                <option>Licence 2</option>
                <option>Licence 3</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="text-align: left">
            <label>Code d'inscription</label>
            <input
              type="text"
              id="reg-code"
              placeholder="Ex: SMI-2025"
              style="text-transform: uppercase"
              oninput="this.value = this.value.toUpperCase()"
            />
            <div
              style="font-size: 12px; color: var(--gris-text); margin-top: 4px"
            >
              Code fourni par l'administration de l'école
            </div>
          </div>

          <button class="btn btn-primary" onclick="passerEtape2()">
            Suivant → Choisir mes cours
          </button>
        </div>

        <!-- Étape 2 : Choix des matières -->
        <div id="step-2" style="display: none">
          <div style="margin-bottom: 1.2rem">
            <div
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 6px;
              "
            >
              <button
                onclick="retourEtape1()"
                style="
                  background: none;
                  border: none;
                  cursor: pointer;
                  color: var(--bleu);
                  font-size: 13px;
                  font-weight: 600;
                  font-family: inherit;
                "
              >
                ← Retour
              </button>
            </div>
            <p style="font-size: 14px; color: var(--gris-text)">
              Sélectionnez les professeurs qui vous enseignent ce semestre.
            </p>
          </div>

          <div
            id="profs-liste"
            style="
              display: flex;
              flex-direction: column;
              gap: 8px;
              margin-bottom: 1.5rem;
            "
          >
            <div style="color: var(--gris-text); font-size: 14px">
              Chargement des professeurs...
            </div>
          </div>

          <div
            style="
              background: var(--bleu-light);
              border-radius: var(--radius-sm);
              padding: 10px 14px;
              font-size: 13px;
              color: var(--bleu-dark);
              margin-bottom: 1.2rem;
            "
          >
            <strong id="count-selectionnes">0</strong> professeur(s)
            sélectionné(s)
          </div>

          <button
            class="btn btn-primary"
            id="btn-inscrire"
            onclick="soumettre()"
          >
            Créer mon compte
          </button>
        </div>

        <div
          style="
            text-align: center;
            margin-top: 1.2rem;
            font-size: 13px;
            color: var(--gris-text);
          "
        >
          Déjà un compte ?
          <a
            href="/pages/login.html"
            style="color: var(--bleu); font-weight: 600; text-decoration: none"
          >
            Se connecter
          </a>
        </div>
      </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/register.js"></script>
  </body>
</html>
